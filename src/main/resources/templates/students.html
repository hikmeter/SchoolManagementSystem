<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
	<div class="d-flex" id="wrapper">

		<div th:replace="~{fragments/layout :: sidebar}"></div>

		<div id="page-content-wrapper">

			<div th:replace="~{fragments/layout :: navbar}"></div>

			<div class="container-fluid px-4 py-4">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h2>Students</h2>
					<a th:href="@{/student/new}" class="btn btn-primary"><i
						class="bi bi-plus-lg me-1"></i> Yeni Öğrenci Ekle</a>
				</div>

				<div th:if="${message}" class="alert alert-success text-center"
					role="alert" th:text="${message}"></div>

				<div class="card mb-4">
					<div class="card-header bg-white">
						<i class="bi bi-table me-1"></i> Öğrenci Listesi
					</div>
					<div class="card-body">
						<div class="table-responsive">
							<table class="table table-hover table-striped">
								<thead>
									<tr>
										<th>ID</th>
										<th>Ad Soyad</th>
										<th>E-Posta Adresi</th>
										<th>Telefon Numarası</th>
										<th>İşlemler</th>
									</tr>
								</thead>
								<tbody>
									<div class="text-muted" th:if="${students.content.isEmpty()}">Öğrenci
										Bulunamadı!</div>
									<tr th:each="student: ${students.content}">
										<td data-label="ID" th:text="${student.id}"></td>
										<td data-label="Name"
											th:text="${student.firstName + ' ' + student.lastName}"></td>
										<td data-label="Email" th:text="${student.email}"></td>
										<td data-label="Phone" th:text="${student.phoneNumber}"></td>
										<td data-label="Actions"><a href="view-student.html"
											class="btn btn-sm btn-info text-white me-1" title="Görüntüle"><i
												class="bi bi-eye"></i></a> <a href="edit-student.html"
											class="btn btn-sm btn-warning text-white me-1"
											title="Güncelle"><i class="bi bi-pencil"></i></a></td>
									</tr>
								</tbody>
							</table>
						</div>
						<nav th:if="${students.totalPages} > 1"
							aria-label="Course pagination">
							<ul class="pagination justify-content-end">

								<!-- Öncesi -->
								<li class="page-item"
									th:classappend="${students.first} ? 'disabled'"><a
									class="page-link"
									th:href="@{'/student/list'(page=${students.number > 0 ? students.number-1 : 0}, size=${students.size})}">Önceki</a></li>

								<!-- Sayfa numaraları -->
								<li class="page-item"
									th:each="pageNum : ${#numbers.sequence(0, students.totalPages - 1)}"
									th:classappend="${pageNum} == ${students.number} ? 'active' : ''"><a
									class="page-link"
									th:href="@{'/student/list'(page=${pageNum}, size=${students.size})}"
									th:text="${pageNum + 1}"></a></li>

								<!-- Sonrası -->
								<li class="page-item"
									th:classappend="${students.last} ? 'disabled'"><a
									class="page-link"
									th:href="@{'/student/list'(page=${students.number + 1}, size=${students.size})}">Sonraki</a></li>

							</ul>
						</nav>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
