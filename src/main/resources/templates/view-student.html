<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
	<div class="d-flex" id="wrapper">

		<div th:replace="~{fragments/layout :: sidebar}"></div>

		<div id="page-content-wrapper">

			<div th:replace="~{fragments/layout :: navbar}"></div>
			<div class="container-fluid px-4 py-4">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h2>Öğrenci Detayları</h2>
					<a th:href="@{/student/list}" class="btn btn-secondary"><i
						class="bi bi-arrow-left me-1"></i> Öğrenci Listesine Dön</a>
				</div>

				<div class="card mb-4">
					<div class="card-header bg-white">
						<i class="bi bi-person-lines-fill me-1"></i> Bilgi
					</div>
					<div class="card-body">
						<div class="row mb-3">
							<div class="col-md-3 fw-bold">Ad Soyad:</div>
							<div class="col-md-9" th:text="${student.firstName + ' ' + student.lastName}"></div>
						</div>
						<div class="row mb-3">
							<div class="col-md-3 fw-bold">E-Posta Adresi:</div>
							<div class="col-md-9" th:text="${student.email}"></div>
						</div>
						<div class="row mb-3">
							<div class="col-md-3 fw-bold">Telefon Numarası:</div>
							<div class="col-md-9" th:text="${student.phoneNumber}"></div>
						</div>
						<div class="row mb-3">
							<div class="col-md-3 fw-bold">Aktif Mi?:</div>
							<div class="col-md-9" th:text="${student.active ? 'Evet' : 'Hayır'}"></div>
						</div>
						<div class="row mb-3">
							<div class="col-md-3 fw-bold">Adres:</div>
							<div class="col-md-9" th:text="${student.address}"></div>
						</div>
					</div>
					<div class="card-footer bg-white">
						<a th:href="@{/student/{id}/edit(id=${student.id})}" class="btn btn-warning text-white"><i
							class="bi bi-pencil me-1"></i> Öğrenciyi Düzenle</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
